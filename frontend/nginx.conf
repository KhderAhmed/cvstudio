server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # الفيديو والصور تُرفع عبر /api: الافتراضي في nginx هو 1MB فقط (يعطي 413)
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # إعدادات الـ proxy (تنطبق على كل location يستخدم proxy_pass أدناه)
    # $http_host يحافظ على المنفذ، وDjango يحتاجه لبناء روابط الملفات وفحص CSRF
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # توليد PDF والصوت (gunicorn timeout = 120)
    proxy_send_timeout 120s;

    # ^~ ضروري: بدونه تلتقط قاعدة الصور/الخطوط (regex) مسارات /media/ و/static/
    # وتبحث عنها داخل nginx بدل الباك إند فتعطي 404.
    location ^~ /api/          { proxy_pass http://backend:8000; }
    location ^~ /django-admin/ { proxy_pass http://backend:8000; }
    location ^~ /static/       { proxy_pass http://backend:8000; }
    location ^~ /media/        { proxy_pass http://backend:8000; }

    # ملفات Vite لها hash في اسمها، فيمكن تخزينها لسنة
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # لا تخزّن index.html حتى تصل التحديثات فوراً
    location = /index.html {
        expires -1;
    }

    # SPA: أي مسار غير موجود يرجع index.html ليتولاه Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
